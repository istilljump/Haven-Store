# 开发环境配置
server.port=8080
spring.application.name=second-hand-market

# 数据库配置 - 使用H2内存数据库用于开发测试
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:sql/init.sql'
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2控制台配置（开发时启用）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis配置（可选，开发时可禁用）
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=5000

# JWT配置
jwt.secret=your-secret-key-here-should-be-very-long-and-random
jwt.expiration=86400000

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 日志配置
logging.level.root=INFO
logging.level.com.example=DEBUG

# 日志文件配置
logging.file.name=logs/application.log